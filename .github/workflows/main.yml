
name: Theme Review

on: repository_dispatch

permissions: {}

jobs:
  review:
    name: Review the submitted theme
    runs-on: ubuntu-latest
    permissions: {}

    steps:
    - name: Download Theme
      env:
        THEME_ZIP: ${{ github.event.client_payload.theme_zip }}
      run: |
        curl -L -o theme.zip "$THEME_ZIP"
        unzip theme.zip

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Print Environment
      env:
          GITHUB_EVENT: ${{ toJSON(github.event.client_payload) }}
      run: echo "$GITHUB_EVENT"

    - name: Test My Theme
      id: test
      uses: WordPress/theme-review-action@318c64c495cbbebb8c899acf6fbb99ac849ec7bb # trunk as of 2026-08-18
      with:
        root-folder: ${{ github.event.client_payload.theme_slug }}
        accessible-ready: ${{ github.event.client_payload.accessible_ready }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: UI Check Output
        path: ${{ steps.test.outputs.ui-check-output }}
        retention-days: 5
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: Logs
        path: ${{ steps.test.outputs.logs }}

  post:
    name: Post the results to WordPress.org
    needs: review
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Logs
        path: logs

    - name: Prepare the request body
      run: |
        if [ ! -f logs/ui-check-errors.txt ]; then
          echo "::error::logs/ui-check-errors.txt was missing from the review artifact."
          exit 1
        fi

        if [ "$(wc -c < logs/ui-check-errors.txt)" -gt 65536 ]; then
          # Keep the tail, since the review job appends its findings. Drop the
          # first line with it: cutting on a byte offset can leave a partial
          # UTF-8 sequence that the endpoint would reject.
          tail -c 65536 logs/ui-check-errors.txt | tail -n +2 > body.txt
        else
          cp logs/ui-check-errors.txt body.txt
        fi

    - name: Post UI Errors
      env:
        THEME_SLUG: ${{ github.event.client_payload.theme_slug }}
        TRAC_TICKET_ID: ${{ github.event.client_payload.trac_ticket_id }}
        ORG_POST_SECRET: ${{ secrets.ORG_POST_SECRET }}
      run: |
        if [ ! -s body.txt ]; then
          echo "No UI errors to report; nothing to post."
          exit 0
        fi

        curl --fail-with-body --silent --show-error --request POST \
          --url "https://wordpress.org/themes/wp-json/themes/v1/github/${THEME_SLUG}/${TRAC_TICKET_ID}" \
          --header "Authorization: Bearer ${ORG_POST_SECRET}" \
          --data-urlencode "@body.txt"
