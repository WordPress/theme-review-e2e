
name: Theme Review

on: repository_dispatch

permissions: {}

jobs:
  review:
    name: Review the submitted theme
    runs-on: ubuntu-latest
    permissions: {}

    steps:
    - name: Download Theme
      env:
        THEME_ZIP: ${{ github.event.client_payload.theme_zip }}
      run: |
        curl -L -o theme.zip "$THEME_ZIP"
        unzip theme.zip

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Print Environment
      env:
          GITHUB_EVENT: ${{ toJSON(github.event.client_payload) }}
      run: echo "$GITHUB_EVENT"

    - name: Test My Theme
      id: test
      uses: WordPress/theme-review-action@trunk
      with:
        root-folder: ${{ github.event.client_payload.theme_slug }}
        accessible-ready: ${{ github.event.client_payload.accessible_ready }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: UI Check Output
        path: ${{ steps.test.outputs.ui-check-output }}
        retention-days: 5
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: Logs
        path: ${{ steps.test.outputs.logs }}

  post:
    name: Post the results to WordPress.org
    needs: review
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Logs
        path: logs

    - name: Prepare the request body
      run: |
        : > body.txt
        if [ -f logs/ui-check-errors.txt ]; then
          head -c 65536 logs/ui-check-errors.txt > body.txt
        fi

    - name: Post UI Errors
      env:
        THEME_SLUG: ${{ github.event.client_payload.theme_slug }}
        TRAC_TICKET_ID: ${{ github.event.client_payload.trac_ticket_id }}
        ORG_POST_SECRET: ${{ secrets.ORG_POST_SECRET }}
      run: |
        curl --request POST \
          --url "https://wordpress.org/themes/wp-json/themes/v1/github/${THEME_SLUG}/${TRAC_TICKET_ID}" \
          --header "Authorization: Bearer ${ORG_POST_SECRET}" \
          --data-urlencode "@body.txt"
